name: Deploy sites to GitHub Pages

# main 의 deep_learning_study/ 또는 gallery/ 가 바뀌면 둘을 함께 빌드해
# gh-pages 브랜치로 배포한다. 한 워크플로가 전체 사이트를 만든다.
#
#   /          딥러닝 스터디   (기존 URL 유지)
#   /gallery/  인터랙티브 웹 디자인 모음집
#
# 두 개의 워크플로가 각각 force_orphan 으로 gh-pages 에 밀어넣으면
# 서로의 배포를 지운다. 그래서 반드시 이 하나로만 배포한다.
#
# 저장소 Settings → Pages → Source: "Deploy from a branch", Branch: gh-pages / (root)
on:
  push:
    branches: [main]
    paths:
      - "deep_learning_study/**"
      - "gallery/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # ── 딥러닝 스터디 → 루트 ──────────────────────────────
          cp deep_learning_study/index.html _site/
          cp -r deep_learning_study/assets deep_learning_study/content _site/
          if [ -d deep_learning_study/notebooks ]; then
            cp -r deep_learning_study/notebooks _site/
          fi

          # ── 인터랙티브 웹 디자인 모음집 → /gallery/ ───────────
          mkdir -p _site/gallery
          cp gallery/index.html _site/gallery/
          cp -r gallery/assets _site/gallery/
          cp -r gallery/works _site/gallery/
          # 새 작품을 시작할 때 쓰는 빈 틀은 공개하지 않는다.
          # works/_shared 는 각 작품이 참조하므로 반드시 남긴다.
          rm -rf _site/gallery/works/_template

          # 밑줄로 시작하는 _shared 를 Jekyll 이 걸러내지 않도록 한다.
          touch _site/.nojekyll

      - name: Check output
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/gallery/index.html
          test -f _site/gallery/works/_shared/chrome.css
          test -f _site/gallery/works/_shared/chrome.js
          test ! -d _site/gallery/works/_template
          echo "작품 페이지:"
          find _site/gallery/works -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '  %f\n'

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
