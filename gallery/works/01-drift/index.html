<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표류 / Drift — Selected Interactive Work</title>
<meta name="description" content="커서가 지나간 자리마다 벡터장이 휘고, 흐름은 느리게 원래 각도로 되돌아간다.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Azeret+Mono:wght@300;400;500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/chrome.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  .stage { position: fixed; inset: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; }

  /* 큰 글자는 difference 로 얹어 흐름이 글자를 통과해 보이게 한다 */
  .plate {
    position: fixed;
    left: var(--edge);
    bottom: calc(var(--edge) + 6px);
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: difference;
  }
  .plate__ko {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(4.2rem, 17vw, 16rem);
    line-height: .78;
    letter-spacing: -.03em;
    text-indent: -.05em;
    color: #fff;
  }
  .plate__latin {
    display: block;
    margin-top: .1em;
    font-style: italic;
    font-size: .26em;
    letter-spacing: 0;
    color: #fff;
  }

  .readout {
    position: fixed;
    right: var(--edge);
    bottom: var(--edge);
    z-index: 10;
    display: grid;
    gap: 3px;
    justify-items: end;
    text-align: right;
    pointer-events: none;
  }
  .readout b { font-weight: 400; color: var(--sig); }

  .hint {
    position: fixed;
    left: var(--edge);
    top: calc(var(--bar) + 20px);
    z-index: 10;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .readout { display: none; }
  }
</style>
</head>
<body>

<header class="work-bar">
  <a class="work-bar__back" href="../../"><span>&#8592;</span><span>Index</span></a>
  <span class="work-bar__no">01</span>
  <span class="work-bar__title"><b>표류</b><i>Drift</i></span>
  <button class="work-toggle" type="button" aria-expanded="false">Info</button>
</header>

<main class="stage">
  <canvas id="field" role="img" aria-label="커서를 따라 휘는 벡터장 위를 흐르는 입자들"></canvas>
</main>

<p class="hint wlabel">커서를 움직여 흐름을 휘게 한다 · 클릭하면 다시 뿌린다</p>

<div class="plate">
  <h1 class="plate__ko">표류<em class="plate__latin">Drift</em></h1>
</div>

<div class="readout wlabel">
  <span>Particles <b id="r-n">—</b></span>
  <span>Field bend <b id="r-bend">0.00</b></span>
</div>

<aside class="work-info" data-open="false">
  <h2>표류 <i style="font-family:var(--f-display)">Drift</i></h2>
  <p>화면 전체가 하나의 벡터장이다. 입자는 자기 자리의 각도를 따라 흐르고, 지나간 자취만 남긴다. 커서는 주변 각도를 끌어당기지만 손을 떼면 흐름은 느리게 원래 모양으로 되돌아간다.</p>
  <dl class="wlabel">
    <dt>조작</dt><dd>커서 이동 · 클릭으로 재배치</dd>
    <dt>기법</dt><dd>Canvas 2D · 흐름장 적분</dd>
    <dt>연도</dt><dd>2026</dd>
  </dl>
</aside>

<script src="../_shared/chrome.js"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d', { alpha: false });
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  var parts = [];
  var pointer = { x: -9999, y: -9999, px: -9999, py: -9999, speed: 0, live: false };
  var bend = 0;

  var INK = '#e6e2d8';
  var SIG = '#c33c1e';
  var BG = '#141311';

  function count() {
    var area = W * H;
    return Math.max(260, Math.min(1400, Math.round(area / 1500)));
  }

  function seed() {
    parts = [];
    var n = count();
    for (var i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        life: Math.random() * 220,
        max: 140 + Math.random() * 220,
        hot: Math.random() < 0.055,
      });
    }
    var rn = document.getElementById('r-n');
    if (rn) rn.textContent = n;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    seed();
  }

  // 자리마다 정해진 기본 각도 + 커서가 만드는 국소 회전
  function angleAt(x, y, t) {
    var a = Math.sin(x * 0.0032 + t * 0.00018) * 1.4
          + Math.cos(y * 0.0041 - t * 0.00013) * 1.4
          + Math.sin((x + y) * 0.0019 + t * 0.00009) * 0.8;
    if (pointer.live) {
      var dx = x - pointer.x;
      var dy = y - pointer.y;
      var d2 = dx * dx + dy * dy;
      var R = 260;
      if (d2 < R * R) {
        var f = 1 - Math.sqrt(d2) / R;
        a += (Math.atan2(dy, dx) + Math.PI * 0.5) * f * f * (0.9 + bend * 2.2);
      }
    }
    return a;
  }

  function step(now) {
    // 자취를 남기기 위해 지우지 않고 얇게 덮는다
    ctx.fillStyle = 'rgba(20,19,17,0.055)';
    ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = 1;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var a = angleAt(p.x, p.y, now);
      var nx = p.x + Math.cos(a) * 1.5;
      var ny = p.y + Math.sin(a) * 1.5;

      ctx.strokeStyle = p.hot ? SIG : INK;
      ctx.globalAlpha = p.hot ? 0.6 : 0.21;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(nx, ny);
      ctx.stroke();

      p.x = nx; p.y = ny; p.life++;
      if (p.life > p.max || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
        p.x = Math.random() * W;
        p.y = Math.random() * H;
        p.life = 0;
      }
    }
    ctx.globalAlpha = 1;

    // 커서 속도를 0~1 로 환산해 휘는 정도로 쓴다
    bend += (pointer.speed - bend) * 0.08;
    pointer.speed *= 0.9;
    var rb = document.getElementById('r-bend');
    if (rb) rb.textContent = bend.toFixed(2);

    requestAnimationFrame(step);
  }

  function drawStatic() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1;
    for (var k = 0; k < 900; k++) {
      var x = Math.random() * W, y = Math.random() * H;
      ctx.strokeStyle = k % 18 === 0 ? SIG : INK;
      ctx.globalAlpha = k % 18 === 0 ? 0.6 : 0.22;
      for (var s = 0; s < 26; s++) {
        var a = angleAt(x, y, 0);
        var nx = x + Math.cos(a) * 2, ny = y + Math.sin(a) * 2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        x = nx; y = ny;
      }
    }
    ctx.globalAlpha = 1;
  }

  window.addEventListener('pointermove', function (ev) {
    if (pointer.live) {
      var dx = ev.clientX - pointer.x;
      var dy = ev.clientY - pointer.y;
      pointer.speed = Math.min(1, Math.sqrt(dx * dx + dy * dy) / 42);
    }
    pointer.x = ev.clientX;
    pointer.y = ev.clientY;
    pointer.live = true;
  }, { passive: true });

  window.addEventListener('pointerleave', function () { pointer.live = false; });
  window.addEventListener('pointerdown', seed);
  window.addEventListener('resize', resize);

  resize();
  if (reduce) { drawStatic(); } else { requestAnimationFrame(step); }
})();
</script>
</body>
</html>
