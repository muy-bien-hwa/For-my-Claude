<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분절 / Slice — Selected Interactive Work</title>
<meta name="description" content="디스플레이 타이포를 가로로 자르고, 스크롤 속도만큼 어긋내는 실험.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Azeret+Mono:wght@300;400;500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/chrome.css">
<style>
  body { overflow-x: hidden; }

  /* 상단 바 아래 진행 괘선 */
  .progress {
    position: fixed;
    top: var(--bar); left: 0;
    z-index: 490;
    height: 1px;
    width: 100%;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: var(--sig);
  }

  .track { height: 420vh; }

  .stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* 같은 글자를 겹쳐 쌓고, 띠마다 다른 구간만 남긴다 */
  .word { position: relative; width: 100%; height: 100%; }
  .band {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    will-change: transform;
  }
  .band > span {
    font-family: var(--f-display);
    font-size: clamp(3.6rem, 21vw, 19rem);
    line-height: .82;
    letter-spacing: -.035em;
    white-space: nowrap;
    color: var(--ink);
  }
  .band[data-accent='1'] > span { color: var(--sig); }

  .caption {
    position: fixed;
    left: var(--edge);
    bottom: var(--edge);
    z-index: 20;
    display: grid;
    gap: 6px;
    max-width: 30ch;
    pointer-events: none;
  }
  .caption__latin {
    font-family: var(--f-display);
    font-style: italic;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    color: var(--ink);
  }
  .caption__body {
    margin: 0;
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.7;
    color: var(--dim);
  }

  .ticks {
    position: fixed;
    right: var(--edge);
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: grid;
    gap: 12px;
    justify-items: end;
    pointer-events: none;
  }
  .ticks span {
    display: block;
    width: 22px;
    height: 1px;
    background: var(--faint);
    transition: width .4s var(--ease), background-color .4s var(--ease);
  }
  .ticks span[data-on='1'] { width: 48px; background: var(--sig); }

  .scroll-cue {
    position: fixed;
    left: 50%;
    bottom: var(--edge);
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: none;
    transition: opacity .5s var(--ease);
  }

  @media (max-width: 600px) {
    .ticks { display: none; }
    .caption { max-width: none; right: var(--edge); }
  }
</style>
</head>
<body>

<header class="work-bar">
  <a class="work-bar__back" href="../../"><span>&#8592;</span><span>Index</span></a>
  <span class="work-bar__no">02</span>
  <span class="work-bar__title"><b>분절</b><i>Slice</i></span>
  <button class="work-toggle" type="button" aria-expanded="false">Info</button>
</header>
<div class="progress" id="progress"></div>

<main class="track">
  <section class="stage">
    <h1 class="word" id="word" aria-label="분절"></h1>
  </section>
</main>

<div class="caption">
  <span class="caption__latin" id="cap-latin">Slice</span>
  <p class="caption__body" id="cap-body">—</p>
</div>

<div class="ticks" id="ticks" aria-hidden="true"></div>
<p class="scroll-cue wlabel" id="cue">Scroll &#8595;</p>

<aside class="work-info" data-open="false">
  <h2>분절 <i style="font-family:var(--f-display)">Slice</i></h2>
  <p>한 글자를 열네 겹으로 쌓고, 겹마다 다른 가로 구간만 남겼다. 스크롤 속도가 각 겹을 반대 방향으로 밀어낸다. 멈추면 겹이 제자리로 모여 다시 한 글자가 된다.</p>
  <dl class="wlabel">
    <dt>조작</dt><dd>스크롤 속도</dd>
    <dt>기법</dt><dd>clip-path 적층 · 속도 감쇠</dd>
    <dt>연도</dt><dd>2026</dd>
  </dl>
</aside>

<script src="../_shared/chrome.js"></script>
<script>
(function () {
  'use strict';

  var BANDS = 14;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CHAPTERS = [
    { ko: '분절', latin: 'Slice',  body: '한 덩어리였던 글자를 가로로 끊는다. 끊긴 자리는 아직 보이지 않는다.' },
    { ko: '어긋남', latin: 'Offset', body: '스크롤이 빨라질수록 겹이 서로 반대로 밀린다. 글자는 읽히기를 멈추고 무늬가 된다.' },
    { ko: '봉합', latin: 'Suture', body: '손을 떼면 겹은 제자리로 수렴한다. 글자는 돌아오지만 잘린 선은 기억에 남는다.' },
  ];

  var wordEl = document.getElementById('word');
  var capLatin = document.getElementById('cap-latin');
  var capBody = document.getElementById('cap-body');
  var progress = document.getElementById('progress');
  var ticksEl = document.getElementById('ticks');
  var cue = document.getElementById('cue');

  // 띠 만들기 — 각 띠는 전체 글자를 담고 자기 구간만 남긴다
  var bands = [];
  for (var i = 0; i < BANDS; i++) {
    var b = document.createElement('span');
    b.className = 'band';
    b.setAttribute('aria-hidden', 'true');
    b.style.clipPath = 'inset(' + (i / BANDS * 100) + '% 0 ' + ((BANDS - 1 - i) / BANDS * 100) + '% 0)';
    if (i === 4 || i === 9) b.dataset.accent = '1';
    var inner = document.createElement('span');
    b.appendChild(inner);
    wordEl.appendChild(b);
    bands.push({ el: b, inner: inner, dir: i % 2 ? 1 : -1, gain: 0.35 + (i % 5) * 0.3, off: 0 });
  }

  CHAPTERS.forEach(function (_, idx) {
    var t = document.createElement('span');
    t.dataset.on = idx === 0 ? '1' : '0';
    ticksEl.appendChild(t);
  });

  var current = -1;
  function setChapter(idx) {
    if (idx === current) return;
    current = idx;
    var c = CHAPTERS[idx];
    bands.forEach(function (b) { b.inner.textContent = c.ko; });
    wordEl.setAttribute('aria-label', c.ko);
    capLatin.textContent = c.latin;
    capBody.textContent = c.body;
    Array.prototype.forEach.call(ticksEl.children, function (t, i) {
      t.dataset.on = i === idx ? '1' : '0';
    });
  }

  var lastY = window.scrollY;
  var vel = 0;
  var scrollY = lastY;

  window.addEventListener('scroll', function () { scrollY = window.scrollY; }, { passive: true });

  function frame() {
    var max = Math.max(1, document.body.scrollHeight - window.innerHeight);
    var p = Math.min(1, Math.max(0, scrollY / max));

    progress.style.transform = 'scaleX(' + p + ')';
    cue.style.opacity = p > 0.03 ? '0' : '1';
    setChapter(Math.min(CHAPTERS.length - 1, Math.floor(p * CHAPTERS.length)));

    var raw = scrollY - lastY;
    lastY = scrollY;
    vel += (raw - vel) * 0.25;

    if (!reduce) {
      for (var i = 0; i < bands.length; i++) {
        var b = bands[i];
        var target = vel * b.dir * b.gain * 2.6;
        b.off += (target - b.off) * 0.16;
        if (Math.abs(b.off) > 0.05) {
          b.el.style.transform = 'translate3d(' + b.off.toFixed(2) + 'px,0,0)';
        } else if (b.off !== 0) {
          b.off = 0;
          b.el.style.transform = 'translate3d(0,0,0)';
        }
      }
    }
    requestAnimationFrame(frame);
  }

  setChapter(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
