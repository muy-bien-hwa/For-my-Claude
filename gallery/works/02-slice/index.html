<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분절</title>
<meta name="description" content="분절 — 인터랙티브 웹 디자인 작업.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/chrome.css">
<style>
  body { overflow-x: hidden; }

  /* 상단 바 아래 진행 괘선 */
  .progress {
    position: fixed;
    top: var(--bar); left: 0;
    z-index: 490;
    height: 1px;
    width: 100%;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: var(--sig);
  }

  .track { height: 420vh; }

  .stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* 같은 글자를 겹쳐 쌓고, 띠마다 다른 구간만 남긴다 */
  .word { position: relative; width: 100%; height: 100%; }
  .band {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    will-change: transform;
  }
  .band > span {
    font-family: var(--f-display);
    font-size: clamp(3.6rem, 21vw, 19rem);
    line-height: .82;
    letter-spacing: -.035em;
    white-space: nowrap;
    color: var(--ink);
  }
  .band[data-accent='1'] > span { color: var(--sig); }

  .ticks {
    position: fixed;
    right: var(--edge);
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: grid;
    gap: 12px;
    justify-items: end;
    pointer-events: none;
  }
  .ticks span {
    display: block;
    width: 22px;
    height: 1px;
    background: var(--faint);
    transition: width .4s var(--ease), background-color .4s var(--ease);
  }
  .ticks span[data-on='1'] { width: 48px; background: var(--sig); }

  @media (max-width: 600px) {
    .ticks { display: none; }
  }
</style>
</head>
<body>

<header class="work-bar">
  <a class="work-bar__back" href="../../"><span>&#8592;</span><span>목록</span></a>
  <span class="work-bar__no">02</span>
  <span class="work-bar__title"><b>분절</b></span>
  <button class="work-toggle" type="button" aria-expanded="false">정보</button>
</header>
<div class="progress" id="progress"></div>

<main class="track">
  <section class="stage">
    <h1 class="word" id="word" aria-label="분절"></h1>
  </section>
</main>

<div class="ticks" id="ticks" aria-hidden="true"></div>

<aside class="work-info" data-open="false">
  <h2>분절</h2>
  <dl class="wlabel">
    <dt>기법</dt><dd>겹 적층 · 속도 감쇠</dd>
    <dt>연도</dt><dd>2026</dd>
  </dl>
</aside>

<script src="../_shared/chrome.js"></script>
<script>
(function () {
  'use strict';

  var BANDS = 14;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CHAPTERS = ['분절', '어긋남', '봉합'];

  var wordEl = document.getElementById('word');
  var progress = document.getElementById('progress');
  var ticksEl = document.getElementById('ticks');

  // 띠 만들기 — 각 띠는 전체 글자를 담고 자기 구간만 남긴다
  var bands = [];
  for (var i = 0; i < BANDS; i++) {
    var b = document.createElement('span');
    b.className = 'band';
    b.setAttribute('aria-hidden', 'true');
    b.style.clipPath = 'inset(' + (i / BANDS * 100) + '% 0 ' + ((BANDS - 1 - i) / BANDS * 100) + '% 0)';
    if (i === 4 || i === 9) b.dataset.accent = '1';
    var inner = document.createElement('span');
    b.appendChild(inner);
    wordEl.appendChild(b);
    bands.push({ el: b, inner: inner, dir: i % 2 ? 1 : -1, gain: 0.35 + (i % 5) * 0.3, off: 0 });
  }

  CHAPTERS.forEach(function (_, idx) {
    var t = document.createElement('span');
    t.dataset.on = idx === 0 ? '1' : '0';
    ticksEl.appendChild(t);
  });

  var current = -1;
  function setChapter(idx) {
    if (idx === current) return;
    current = idx;
    var c = CHAPTERS[idx];
    bands.forEach(function (b) { b.inner.textContent = c; });
    wordEl.setAttribute('aria-label', c);
    Array.prototype.forEach.call(ticksEl.children, function (t, i) {
      t.dataset.on = i === idx ? '1' : '0';
    });
  }

  var lastY = window.scrollY;
  var vel = 0;
  var scrollY = lastY;

  window.addEventListener('scroll', function () { scrollY = window.scrollY; }, { passive: true });

  function frame() {
    var max = Math.max(1, document.body.scrollHeight - window.innerHeight);
    var p = Math.min(1, Math.max(0, scrollY / max));

    progress.style.transform = 'scaleX(' + p + ')';
    setChapter(Math.min(CHAPTERS.length - 1, Math.floor(p * CHAPTERS.length)));

    var raw = scrollY - lastY;
    lastY = scrollY;
    vel += (raw - vel) * 0.25;

    if (!reduce) {
      for (var i = 0; i < bands.length; i++) {
        var b = bands[i];
        var target = vel * b.dir * b.gain * 2.6;
        b.off += (target - b.off) * 0.16;
        if (Math.abs(b.off) > 0.05) {
          b.el.style.transform = 'translate3d(' + b.off.toFixed(2) + 'px,0,0)';
        } else if (b.off !== 0) {
          b.off = 0;
          b.el.style.transform = 'translate3d(0,0,0)';
        }
      }
    }
    requestAnimationFrame(frame);
  }

  setChapter(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
