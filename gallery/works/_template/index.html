<!doctype html>
<!--
  새 작품을 시작할 때 이 폴더를 통째로 복사한다.

    cp -r works/_template works/07-새이름

  그다음 할 일은 네 가지다.
    1) 아래 TODO 를 전부 채운다 (제목·번호·설명).
    2) <main> 안에 작품을 만든다. 조판도 기법도 자유다.
    3) assets/works.js 에 항목을 한 줄 추가한다. slug 는 폴더 이름과 같아야 한다.
    4) assets/previews.js 에 썸네일 스케치를 하나 등록하고 works.js 의 preview 에 그 키를 쓴다.

  공통 껍데기(chrome.css / chrome.js)가 주는 것
    · 색·서체 토큰, 그레인, 상단 바, 설명 패널
    · ESC → 목록으로, I → 설명 패널
  그 아래로는 이 파일에서 뭐든 덮어써도 된다. 작품마다 달라 보이는 게 목적이다.
-->
